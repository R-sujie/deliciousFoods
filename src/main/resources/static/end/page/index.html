<!-- <script src="../js/element/index.js"></script> -->

<script>
	new Vue({
		el: "#wrapper",
		data: {
			user: {},
			authority: []
		},
		created: function () {
			axios.get("/authority").then(res => {
				if (res.data.code === '0') {
					this.authority = res.data.data;
				} else {
					msg('error', res.data.msg);
				}
			});

			let user = JSON.parse(localStorage.getItem('user'));
			this.user = user;
		},
		methods: {
			logout() {
				logout();
			},
			personalPage() {
				window.location.href = 'personalInfo.html';
			}
		}
	});
</script>
